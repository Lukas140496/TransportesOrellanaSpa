<div class="dashboard">

    <h1>Dashboard</h1>
  
    <div class="cards">
  
      <div class="card">
        <span class="card-title">Camiones</span>
        <span class="card-value">{{ camionesCount }}</span>
      </div>
  
      <div class="card">
        <span class="card-title">Conductores</span>
        <span class="card-value">{{ conductoresCount }}</span>
      </div>
  
      <div class="card">
        <span class="card-title">Remolques</span>
        <span class="card-value">{{ remolquesCount }}</span>
      </div>
  
      <div class="card">
        <span class="card-title">Clientes</span>
        <span class="card-value">{{ clientesCount }}</span>
      </div>
  
      <div class="card">
        <span class="card-title">Viajes</span>
        <span class="card-value">{{ viajesCount }}</span>
      </div>
  
    </div>
  
</div>
